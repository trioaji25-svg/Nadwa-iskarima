
<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565C0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Attendance</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <div class="brand">
        <div class="logo">✦</div>
        <h1>Smart Attendance</h1>
        <p>Student Attendance Management System</p>
    </div>

    <div class="login-box">

        <div class="tabs">
            <button id="loginTab" class="active"
                onclick="showForm('login')">Login</button>

            <button id="registerTab"
                onclick="showForm('register')">Register</button>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Silakan login ke akun admin kamu.</p>

            <label>Email</label>
            <input type="email" id="loginEmail"
                placeholder="Masukkan email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="loginPassword"
                    placeholder="Masukkan password" required>
                <button type="button"
                    onclick="togglePassword('loginPassword', this)">Lihat</button>
            </div>

            <button type="submit" class="main-btn">
                Login Sekarang
            </button>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" class="hidden">
            <h2>Buat Akun Admin</h2>
            <p class="subtitle">Daftarkan akun admin baru.</p>

            <label>Nama Lengkap</label>
            <input type="text" id="registerName"
                placeholder="Nama lengkap" required>

            <label>Email</label>
            <input type="email" id="registerEmail"
                placeholder="Email aktif" required>

            <label>Password</label>
            <input type="password" id="registerPassword"
                placeholder="Minimal 6 karakter" minlength="6" required>

            <label>Konfirmasi Password</label>
            <input type="password" id="confirmPassword"
                placeholder="Ulangi password" required>

            <button type="submit" class="main-btn">
                Daftar Akun
            </button>
        </form>

        <p id="message"></p>
    </div>

    <footer>
        © 2026 Smart Attendance. All Rights Reserved.
    </footer>

</div>

<script src="login.js"></script>
</body>
</html>
